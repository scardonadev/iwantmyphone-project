org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# URL de la API para los builds debug. Sin barra final.
#   - Teléfono por USB + `adb reverse tcp:4000 tcp:4000`: http://localhost:4000 (por defecto)
#   - Teléfono por Wi-Fi: la IP LAN del PC, p. ej. http://192.168.1.50:4000
# Se puede sobrescribir sin tocar este archivo: .\gradlew.bat installDebug -Piwmp.apiUrl=http://192.168.1.50:4000
iwmp.apiUrl=https://api-iwantmyphone.apps.scardona.me
# URL de la API para release (HTTPS obligatorio: el release no permite tráfico en claro).
iwmp.apiUrlRelease=https://api-iwantmyphone.apps.scardona.me

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
